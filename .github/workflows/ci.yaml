name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  BACKEND_DIR: src/backend

jobs:

  lint:
    name: Lint và type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt

      - name: Cài dependency
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install -r requirements-dev.txt

      - name: ruff check
        working-directory: ${{ env.BACKEND_DIR }}
        run: ruff check .

      - name: ruff format --check
        working-directory: ${{ env.BACKEND_DIR }}
        run: ruff format --check .

      - name: mypy
        working-directory: ${{ env.BACKEND_DIR }}
        run: mypy app

  test:
    name: Unit và integration test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: real_estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt

      - name: Cài dependency hệ thống cho WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libfontconfig1 libgdk-pixbuf-2.0-0 fonts-dejavu-core

      - name: Cài dependency Python
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install -r requirements-dev.txt

      - name: Chạy test và kiểm tra coverage
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/real_estate_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/real_estate_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-secret-key-not-for-production
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=40

      - name: Kiểm tra migration chạy được trên database sạch
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/real_estate_test
          JWT_SECRET_KEY: ci-secret-key-not-for-production
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current

  build:
    name: Build image backend
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t real-estate-api:ci src/backend

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Tạo .env cho compose
        run: |
          cp .env.example .env
          python3 - <<'PY' >> .env
          import secrets
          print(f"JWT_SECRET_KEY={secrets.token_urlsafe(48)}")
          PY

      - name: Dựng hạ tầng và API
        run: docker compose up -d --wait postgres redis api

      - name: Gọi health endpoint
        run: curl -fsS http://localhost:8000/health

      - name: Chạy migration trong container
        run: docker compose exec -T api python -m alembic upgrade head

      - name: Log khi thất bại
        if: failure()
        run: docker compose logs --no-color

      - name: Dọn
        if: always()
        run: docker compose down -v
