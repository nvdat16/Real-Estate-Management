[project]
name = "real-estate-backend"
version = "1.0.0"
description = "Backend hệ thống quản lý bất động sản"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",     # Depends() trong default argument là idiom của FastAPI
    "RUF001",   # tài liệu và thông báo tiếng Việt dùng –, ×, … một cách có chủ đích
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]      # assert và secret giả trong test
"scripts/*" = ["S106", "S311"]            # seed dùng mật khẩu demo và random thường
"migrations/*" = ["E501"]
# Repository SQL tay (ADR-011): f-string chỉ chèn hằng số và cột trong allowlist,
# mọi giá trị người dùng đi qua tham số bind `:ten` của `text()`.
"app/common/db.py" = ["S608"]
"app/modules/{projects,properties,listings}/repository.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "celery.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: cần PostgreSQL thật qua TEST_DATABASE_URL",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async chạy truy vấn qua greenlet; thiếu dòng này coverage bỏ sót
# các dòng ngay sau `await` truy vấn DB và báo thấp hơn thực tế.
concurrency = ["greenlet", "thread"]
omit = [
    "app/workers/celery.py",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
