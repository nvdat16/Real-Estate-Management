[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# URL thật được lấy từ biến môi trường DATABASE_URL trong migrations/env.py.
# Giá trị dưới đây chỉ để alembic không báo thiếu cấu hình.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Tên file revision có timestamp để thứ tự đọc trong repo khớp thứ tự áp dụng.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
