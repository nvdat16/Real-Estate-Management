name: real-estate

services:

  postgres:
    image: postgres:16
    container_name: real-estate-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-real_estate}
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: real-estate-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: src/backend
      args:
        INSTALL_DEV: "true"
    container_name: real-estate-api
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./src/backend:/app
      - file_storage:/var/lib/rem/files
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-real_estate}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY chưa được đặt, xem .env.example}
      FILE_STORAGE_DIR: /var/lib/rem/files
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # Uvicorn chỉ lấy IP client từ X-Forwarded-For khi request đến từ Nginx;
      # gọi thẳng cổng api thì không giả mạo được IP để né rate limit.
      FORWARDED_ALLOW_IPS: ${NGINX_IP:-172.28.0.10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Worker chưa có mã nguồn (app/workers/celery.py còn rỗng) nên được đặt sau
  # profile để `docker compose up` không đỏ. Bỏ profile khi làm PLAN Phase 4.
  worker:
    build:
      context: src/backend
      args:
        INSTALL_DEV: "true"
    container_name: real-estate-worker
    profiles: ["worker"]
    command: celery -A app.workers.celery worker --loglevel=info
    volumes:
      - ./src/backend:/app
      - file_storage:/var/lib/rem/files
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-real_estate}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY chưa được đặt, xem .env.example}
      FILE_STORAGE_DIR: /var/lib/rem/files
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: real-estate-frontend
    working_dir: /app
    # npm ci không ghi lại package-lock.json, tránh lockfile bị sửa vì chạy
    # trong image alpine (npm install sẽ xóa metadata libc của nền tảng khác).
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: /api/v1

  nginx:
    image: nginx:1.27-alpine
    container_name: real-estate-nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      default:
        ipv4_address: ${NGINX_IP:-172.28.0.10}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  mailhog:
    image: mailhog/mailhog
    container_name: real-estate-mailhog
    platform: linux/amd64
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

# Subnet cố định để Nginx có IP tĩnh (api tin X-Forwarded-For từ IP này).
# Container khác nhận IP động ở nửa trên (ip_range) nên không tranh IP của Nginx.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/24}
          ip_range: ${DOCKER_IP_RANGE:-172.28.0.128/25}

volumes:
  postgres_data:
  file_storage:
  frontend_node_modules:
