services:

  postgres:
    image: postgres:16
    container_name: real-estate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: real-estate-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    container_name: real-estate-api
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/real_estate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    container_name: real-estate-worker
    command: celery -A app.workers.celery worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/real_estate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  mailhog:
    image: mailhog/mailhog
    container_name: real-estate-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
