# Reverse proxy cho môi trường dev/demo (PLAN task 0.3).
# File này được mount vào /etc/nginx/conf.d/default.conf nên nằm trong http context.

# Giữ X-Request-ID do client gửi; nếu không có thì sinh mới để log của Nginx và
# của API trùng nhau. Middleware RequestIDMiddleware sẽ dùng lại giá trị này.
map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream api_upstream {
    server api:8000;
}

upstream frontend_upstream {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # SPEC SP-06: upload KYC/import tối đa 10 MB, chừa thêm phần overhead multipart.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx là điểm vào đầu tiên: ghi đè để client không chèn IP giả vào chuỗi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $forwarded_request_id;
        proxy_read_timeout 60s;
        proxy_buffering off;
        # API tự đặt nosniff cho tệp tải xuống; bỏ bản của upstream để không lặp header
        # với add_header ở server block.
        proxy_hide_header X-Content-Type-Options;
    }

    # Liveness, readiness và tài liệu API do backend phục vụ.
    location = /health {
        proxy_pass http://api_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $forwarded_request_id;
        access_log off;
    }

    location = /ready {
        proxy_pass http://api_upstream/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $forwarded_request_id;
        access_log off;
    }

    location = /openapi.json {
        proxy_pass http://api_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://api_upstream/docs;
        proxy_set_header Host $host;
    }

    # Phần còn lại là ứng dụng React. Dev dùng Vite dev server nên cần upgrade
    # cho HMR websocket; khi triển khai thật sẽ đổi sang serve thư mục build.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
